<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>__TEXT_pageTitle__</title>
  <meta name="description" content="__TEXT_pageDescription__">
  <script>
    // Capture and remove credentials BEFORE loading any external resource.
    const APP_RESET_URL = 'babysteps://reset-password';
    const WEB_RESET_URL = 'https://mabatista2010.github.io/babysteps-legal/reset-password.html';
    const RECOVERY_LOCALES = ['es', 'fr', 'en', 'pt-PT', 'it'];
    const AUTH_KEYS = ['code', 'access_token', 'refresh_token', 'token_hash', 'token_type', 'type', 'error', 'error_code', 'error_description'];
    function collectAuthParams() {
      const url = new URL(window.location.href);
      const expected = new URL(WEB_RESET_URL);
      const params = new URLSearchParams();
      let ambiguous = false;
      let localeAmbiguous = false;
      let hash = url.hash.replace(/^#/, '');
      if (hash.startsWith('/') && hash.includes('?')) hash = hash.slice(hash.indexOf('?') + 1);
      for (const source of [url.searchParams, new URLSearchParams(hash)]) {
        source.forEach((value, key) => {
          if (!value || ![...AUTH_KEYS, 'lang'].includes(key)) return;
          if (params.has(key) && params.get(key) !== value) {
            ambiguous = true;
            if (key === 'lang') localeAmbiguous = true;
          }
          params.set(key, value);
        });
      }
      return { params, ambiguous, localeAmbiguous, trusted: url.origin === expected.origin && url.pathname === expected.pathname && !url.username && !url.password };
    }
    const recoveryInput = collectAuthParams();
    const authParams = recoveryInput.params;
    const recoveryLocale = !recoveryInput.localeAmbiguous && RECOVERY_LOCALES.includes(authParams.get('lang')) ? authParams.get('lang') : 'es';
    document.documentElement.lang = recoveryLocale;
    function stripRecoveryParamsFromAddressBar() {
      window.history.replaceState({}, document.title, `${window.location.pathname}?lang=${recoveryLocale}`);
    }
    stripRecoveryParamsFromAddressBar();
  </script>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body data-reset-page>
  <nav class="site-nav">
    <div class="site-shell nav-inner">
      <a id="home-link" class="brand" href="index.html" aria-label="__TEXT_homeLabel__"><span class="brand-mark">♡</span><span>BabySteps</span></a>
      <div id="legal-nav" class="nav-links" aria-label="__TEXT_navLabel__">
        <a id="privacy-link" href="privacy-es.html" data-copy="privacy">__TEXT_privacy__</a>
        <a data-support-link href="support-es.html" data-copy="support">__TEXT_support__</a>
      </div>
    </div>
  </nav>
  <main class="site-shell reset-shell">
    <section class="reset-card" aria-labelledby="reset-title">
      <div class="kicker" data-copy="kicker">__TEXT_kicker__</div>
      <h1 id="reset-title" data-copy="title">__TEXT_title__</h1>
      <p class="lede" data-copy="intro">__TEXT_intro__</p>
      <div id="reset-status" class="reset-status" role="status" aria-live="polite" data-copy="checking">__TEXT_checking__</div>
      <div class="button-row reset-actions">
        <a id="open-app-link" class="button primary" href="babysteps://reset-password" rel="nofollow noreferrer" data-copy="openApp">__TEXT_openApp__</a>
        <a id="web-action" class="button secondary" href="#web-reset-form" data-copy="webAction">__TEXT_webAction__</a>
      </div>
      <form id="web-reset-form" class="reset-form" novalidate>
        <label>
          <span data-copy="password">__TEXT_password__</span>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="__TEXT_passwordPlaceholder__" required disabled>
        </label>
        <label>
          <span data-copy="confirmPassword">__TEXT_confirmPassword__</span>
          <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="8" placeholder="__TEXT_confirmPlaceholder__" required disabled>
        </label>
        <button id="submit-button" class="button primary" type="submit" data-copy="submit" disabled>__TEXT_submit__</button>
        <button id="cancel-button" class="button secondary" type="button" data-copy="cancel">__TEXT_cancel__</button>
      </form>
      <p class="reset-help" data-copy="help">__TEXT_help__</p>
    </section>
  </main>
  <footer class="footer">
    <div class="site-shell footer-inner">
      <span data-copy="rights">__TEXT_rights__</span>
      <span><a data-support-link href="support-es.html" data-copy="support">__TEXT_support__</a></span>
    </div>
  </footer>
  <script>
    const SUPABASE_URL = 'https://emsazfgkobjndjzofeoh.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable__-I0joppOFhW3w9GStRvSg_2UpNWQWQ';
    const COPY = __BRIDGE_COPY_JSON__;
    const copy = COPY[recoveryLocale];
    document.title = copy.pageTitle;
    document.querySelector('meta[name="description"]').setAttribute('content', copy.pageDescription);
    document.querySelectorAll('[data-copy]').forEach((element) => { element.textContent = copy[element.dataset.copy]; });
    document.getElementById('home-link').setAttribute('aria-label', copy.homeLabel);
    document.getElementById('legal-nav').setAttribute('aria-label', copy.navLabel);
    const legalSuffix = recoveryLocale === 'en' ? '' : `-${recoveryLocale === 'pt-PT' ? 'pt' : recoveryLocale}`;
    document.getElementById('privacy-link').setAttribute('href', `privacy${legalSuffix}.html`);
    document.querySelectorAll('[data-support-link]').forEach((element) => { element.setAttribute('href', `support${legalSuffix}.html`); });

    const statusEl = document.getElementById('reset-status');
    const appLink = document.getElementById('open-app-link');
    const form = document.getElementById('web-reset-form');
    const submitButton = document.getElementById('submit-button');
    const cancelButton = document.getElementById('cancel-button');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirm-password');
    passwordInput.setAttribute('placeholder', copy.passwordPlaceholder);
    confirmPasswordInput.setAttribute('placeholder', copy.confirmPlaceholder);
    let autoOpenTimer = null;
    let client = null;
    let sessionActive = false;
    let busy = false;
    let closed = false;

    function setStatus(message, tone = 'info') {
      statusEl.textContent = message;
      statusEl.dataset.tone = tone;
    }
    function hasRecoveryPayload(params) {
      if (!recoveryInput.trusted || recoveryInput.ambiguous || ['error', 'error_code', 'error_description'].some((key) => params.has(key))) return false;
      if (params.get('type') && params.get('type') !== 'recovery') return false;
      const implicit = params.has('access_token') || params.has('refresh_token');
      if ([params.has('code'), params.has('token_hash'), implicit].filter(Boolean).length !== 1) return false;
      return params.has('code') || (params.get('type') === 'recovery' && (params.has('token_hash') || (params.has('access_token') && params.has('refresh_token'))));
    }
    function buildAppDeepLink(params) {
      const target = new URLSearchParams();
      if (hasRecoveryPayload(params)) {
        AUTH_KEYS.filter((key) => !key.startsWith('error')).forEach((key) => {
          if (params.has(key)) target.set(key, params.get(key));
        });
      } else {
        target.set('error_code', 'recovery_invalid');
      }
      target.set('lang', recoveryLocale);
      return `${APP_RESET_URL}?${target}`;
    }
    function stopAutoOpen() {
      if (autoOpenTimer !== null) window.clearTimeout(autoOpenTimer);
      autoOpenTimer = null;
    }
    function removeAppCredentials() {
      appLink.setAttribute('href', `${APP_RESET_URL}?lang=${recoveryLocale}`);
    }
    function forgetCredentials() {
      AUTH_KEYS.forEach((key) => authParams.delete(key));
      appLink.setAttribute('href', 'babysteps://login?fromRecovery=1');
      passwordInput.value = '';
      confirmPasswordInput.value = '';
    }
    async function clearSession(scope) {
      if (!sessionActive || !client) return;
      sessionActive = false;
      try {
        const { error } = await client.auth.signOut({ scope });
        if (error && scope === 'global') await client.auth.signOut({ scope: 'local' }).catch(() => undefined);
      } catch {
        if (scope === 'global') await client.auth.signOut({ scope: 'local' }).catch(() => undefined);
      }
    }
    async function cancelRecovery() {
      if (busy || closed) return;
      closed = true;
      stopAutoOpen();
      forgetCredentials();
      submitButton.disabled = true;
      cancelButton.disabled = true;
      passwordInput.disabled = true;
      confirmPasswordInput.disabled = true;
      await clearSession('local');
      setStatus(copy.cancelled);
    }

    appLink.setAttribute('href', buildAppDeepLink(authParams));
    if (hasRecoveryPayload(authParams)) {
      submitButton.disabled = false;
      passwordInput.disabled = false;
      confirmPasswordInput.disabled = false;
      setStatus(copy.valid, 'success');
      autoOpenTimer = window.setTimeout(() => {
        autoOpenTimer = null;
        if (!closed && !busy) window.location.href = appLink.getAttribute('href');
      }, 650);
    } else {
      setStatus(copy.invalid, 'error');
      submitButton.disabled = true;
    }
    form.addEventListener('focusin', stopAutoOpen);
    document.getElementById('web-action').addEventListener('click', stopAutoOpen);
    appLink.addEventListener('click', stopAutoOpen);
    cancelButton.addEventListener('click', cancelRecovery);
    window.addEventListener('pagehide', () => {
      if (!busy) { void cancelRecovery(); return; }
      // A request already sent cannot be undone. Never start an update after leaving.
      closed = true;
      stopAutoOpen();
      forgetCredentials();
    });

    async function establishWebRecoverySession(client, params) {
      if (!hasRecoveryPayload(params)) throw new Error('recovery_invalid');
      const result = params.has('code')
        ? await client.auth.exchangeCodeForSession(params.get('code'))
        : params.has('token_hash')
          ? await client.auth.verifyOtp({ token_hash: params.get('token_hash'), type: 'recovery' })
          : await client.auth.setSession({ access_token: params.get('access_token'), refresh_token: params.get('refresh_token') });
      if (result.error || !result.data.session) throw new Error('recovery_invalid');
      sessionActive = true;
      AUTH_KEYS.forEach((key) => authParams.delete(key));
    }
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (busy || closed) return;
      stopAutoOpen();
      if (!sessionActive && !hasRecoveryPayload(authParams)) {
        setStatus(copy.invalid, 'error');
        return;
      }
      const password = passwordInput.value;
      if (password.length < 8) {
        setStatus(copy.minLength, 'error');
        passwordInput.focus();
        return;
      }
      if (password !== confirmPasswordInput.value) {
        setStatus(copy.mismatch, 'error');
        confirmPasswordInput.focus();
        return;
      }
      if (!window.supabase || typeof window.supabase.createClient !== 'function') {
        setStatus(copy.moduleError, 'error');
        return;
      }
      busy = true;
      submitButton.disabled = true;
      cancelButton.disabled = true;
      passwordInput.disabled = true;
      confirmPasswordInput.disabled = true;
      submitButton.textContent = copy.saving;
      removeAppCredentials();
      setStatus(copy.updating);
      try {
        if (!client) client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
          auth: { autoRefreshToken: false, detectSessionInUrl: false, persistSession: false },
        });
        if (!sessionActive) await establishWebRecoverySession(client, authParams);
        if (closed) {
          await clearSession('local');
          setStatus(copy.cancelled);
          return;
        }
        const { error } = await client.auth.updateUser({ password });
        if (error) throw error;
        closed = true;
        await clearSession('global');
        forgetCredentials();
        setStatus(copy.success, 'success');
        submitButton.textContent = copy.updated;
      } catch (error) {
        // A pagehide during update is terminal, even for a normally retryable error.
        const correctable = !closed && sessionActive && error && error.code === 'same_password';
        setStatus(correctable ? copy.samePassword : copy.invalid, 'error');
        if (!correctable) {
          closed = true;
          forgetCredentials();
          await clearSession('local');
        }
        submitButton.textContent = copy.submit;
      } finally {
        busy = false;
        submitButton.disabled = closed;
        cancelButton.disabled = closed;
        passwordInput.disabled = closed;
        confirmPasswordInput.disabled = closed;
      }
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.104.0/dist/umd/supabase.min.js" integrity="sha384-DBZI/1Gz1C29oeP5N6ORumbrmMNoaze4Afb4/c3JkFv79Wh3n1DIzbLRVbu6sJQT" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</body>
</html>
